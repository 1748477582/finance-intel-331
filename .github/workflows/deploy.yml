name: 测试与部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 自动验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行全部测试（数据层 / 合规 / 运行时冒烟）
        run: npm test

  deploy:
    name: 部署到 Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取板块行情数据
        run: node scripts/fetch_sectors.mjs
        continue-on-error: true

      - name: 组装站点目录
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -f feed.json ]; then cp feed.json _site/feed.json; fi
          if [ -f sectors.json ]; then cp sectors.json _site/sectors.json; fi
          if [ -f manifest.json ]; then cp manifest.json _site/manifest.json; fi
          if [ -f sw.js ]; then cp sw.js _site/sw.js; fi
          if [ -d icons ]; then cp -r icons _site/icons; fi
          touch _site/.nojekyll

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
